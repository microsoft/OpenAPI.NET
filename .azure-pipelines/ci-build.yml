name: $(BuildDefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)
trigger:
  branches:
    include:
    - main
    - support/v1
    - support/v2
  tags:
    include:
    - 'v*'
pr:
  branches:
    include:
    - main
    - support/v1
    - support/v2

variables:
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
  NuGetOrganizationName: 'openapinet'
  privateFeedBaseUrl: 'https://microsoftgraph.pkgs.visualstudio.com/0985d294-5762-4bc2-a565-161ef349ca3e/_packaging/GraphDeveloperExperiences_Public'
  ProductBinPath: '$(Build.SourcesDirectory)\src\Microsoft.OpenApi\bin\$(BuildConfiguration)'
  
resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-2022
      os: windows
    customBuildTags:
    - ES365AIMigrationTooling
    stages:
    - stage: build
      jobs:
      - job: build
        templateContext:
          outputs:
          - output: pipelineArtifact
            displayName: 'Publish Artifact: Nugets'
            artifactName: Nugets
            targetPath: '$(Build.ArtifactStagingDirectory)/Nugets'
        steps:
        - task: UseDotNet@2
          displayName: 'Use .NET 6'
          inputs:
            version: 6.x

        - task: UseDotNet@2
          displayName: 'Use .NET 8'
          inputs:
            version: 8.x

        - task: UseDotNet@2
          displayName: 'Use .NET 10'
          inputs:
            useGlobalJson: true
        
        # Install the nuget tool.
        - task: NuGetToolInstaller@1
          displayName: 'Use NuGet >=6.11.0'
          inputs:
            versionSpec: '>=6.11.0'
            checkLatest: true

        # Build the Product project
        - task: NuGetAuthenticate@1
          displayName: 'Authenticate to Azure Artifacts'

        - pwsh: |
            @"
            <?xml version="1.0" encoding="utf-8"?>
            <configuration>
              <packageSources>
                <clear />
                <add key="GraphDeveloperExperiences_Public" value="$(privateFeedBaseUrl)/nuget/v3/index.json" />
              </packageSources>
            </configuration>
            "@ | Set-Content -Path "$(Build.SourcesDirectory)/nuget.config" -Encoding UTF8
          displayName: 'Create nuget.config (central feed)'
        - task: DotNetCoreCLI@2
          displayName: 'build'
          inputs:
            projects: '$(Build.SourcesDirectory)\Microsoft.OpenApi.slnx'
            arguments: '--configuration $(BuildConfiguration) --no-incremental'

        # Run the Unit test
        - pwsh: |
            dotnet test "$(Build.SourcesDirectory)\Microsoft.OpenApi.slnx" `
              --configuration $(BuildConfiguration) `
              --no-build `
              -- `
              --report-azdo `
              --publish-azdo-test-results `
              --results-directory="$(Agent.TempDirectory)\TestResults" `
              --minimum-expected-tests 1
          displayName: 'test'

        - task: EsrpCodeSigning@6
          displayName: 'ESRP CodeSigning binaries'
          inputs:
            ConnectedServiceName: 'Federated DevX ESRP Managed Identity Connection'
            AppRegistrationClientId: '65035b7f-7357-4f29-bf25-c5ee5c3949f8'
            AppRegistrationTenantId: 'cdc5aeea-15c5-4db6-b079-fcadd2505dc2'
            AuthAKVName: 'akv-prod-eastus'
            AuthCertName: 'ReferenceLibraryPrivateCert'
            AuthSignCertName: 'ReferencePackagePublisherCertificate'
            FolderPath: '$(Build.SourcesDirectory)\src'
            signConfigType: 'inlineSignParams'
            inlineOperation: |
              [
                  {
                      "keyCode": "CP-230012",
                      "operationSetCode": "SigntoolSign",
                      "parameters": [
                      {
                          "parameterName": "OpusName",
                          "parameterValue": "Microsoft"
                      },
                      {
                          "parameterName": "OpusInfo",
                          "parameterValue": "http://www.microsoft.com"
                      },
                      {
                          "parameterName": "FileDigest",
                          "parameterValue": "/fd \"SHA256\""
                      },
                      {
                          "parameterName": "PageHash",
                          "parameterValue": "/NPH"
                      },
                      {
                          "parameterName": "TimeStamp",
                          "parameterValue": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
                      }
                      ],
                      "toolName": "sign",
                      "toolVersion": "1.0"
                  },
                  {
                      "keyCode": "CP-230012",
                      "operationSetCode": "SigntoolVerify",
                      "parameters": [ ],
                      "toolName": "sign",
                      "toolVersion": "1.0"
                  }
              ]
            SessionTimeout: '20'
            MaxConcurrency: '50'
            MaxRetryAttempts: '5'
            PendingAnalysisWaitTimeoutMinutes: '5'

        # Pack core lib
        - pwsh: dotnet pack $(Build.SourcesDirectory)/src/Microsoft.OpenApi/Microsoft.OpenApi.csproj -o $(Build.ArtifactStagingDirectory) --configuration $(BuildConfiguration) --no-build --include-symbols --include-source /p:SymbolPackageFormat=snupkg
          displayName: 'pack OpenAPI'

        # Pack YamlReader
        - pwsh: dotnet pack $(Build.SourcesDirectory)/src/Microsoft.OpenApi.YamlReader/Microsoft.OpenApi.YamlReader.csproj -o $(Build.ArtifactStagingDirectory) --configuration $(BuildConfiguration) --no-build --include-symbols --include-source /p:SymbolPackageFormat=snupkg
          displayName: 'pack YamlReader'

        - task: EsrpCodeSigning@6
          displayName: 'ESRP CodeSigning Nuget Packages'
          inputs:
            ConnectedServiceName: 'Federated DevX ESRP Managed Identity Connection'
            AppRegistrationClientId: '65035b7f-7357-4f29-bf25-c5ee5c3949f8'
            AppRegistrationTenantId: 'cdc5aeea-15c5-4db6-b079-fcadd2505dc2'
            AuthAKVName: 'akv-prod-eastus'
            AuthCertName: 'ReferenceLibraryPrivateCert'
            AuthSignCertName: 'ReferencePackagePublisherCertificate'
            FolderPath: '$(Build.ArtifactStagingDirectory)'
            Pattern: '*.nupkg'
            signConfigType: 'inlineSignParams'
            inlineOperation: |
              [
                                  {
                                      "keyCode": "CP-401405",
                                      "operationSetCode": "NuGetSign",
                                      "parameters": [ ],
                                      "toolName": "sign",
                                      "toolVersion": "1.0"
                                  },
                                  {
                                      "keyCode": "CP-401405",
                                      "operationSetCode": "NuGetVerify",
                                      "parameters": [ ],
                                      "toolName": "sign",
                                      "toolVersion": "1.0"
                                  }
                              ]
            SessionTimeout: '60'
            MaxConcurrency: '50'
            MaxRetryAttempts: '5'
            PendingAnalysisWaitTimeoutMinutes: '5'
      
        - task: CopyFiles@2
          displayName: Prepare staging folder for upload
          inputs:
            targetFolder: $(Build.ArtifactStagingDirectory)/Nugets
            sourceFolder: $(Build.ArtifactStagingDirectory)
            Contents: |
              *.nupkg
              *.snupkg

        - task: CopyFiles@2
          displayName: 'Include version-check script in Nugets artifact'
          inputs:
            SourceFolder: '$(Build.SourcesDirectory)/scripts'
            Contents: 'check-nuget-package-published.ps1'
            TargetFolder: '$(Build.ArtifactStagingDirectory)/Nugets/scripts'

    - stage: deploy
      condition: and(contains(variables['Build.SourceBranch'], 'refs/tags/v'), succeeded())
      dependsOn: build
      pool:
        name: Azure-Pipelines-1ESPT-ExDShared
        os: linux
        image: ubuntu-latest
      jobs:
      - deployment: deploy_lib
        condition: and(contains(variables['build.SourceBranch'], 'refs/tags/v'), succeeded())
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            artifactName: Nugets
            targetPath: '$(Pipeline.Workspace)'
        dependsOn: []
        environment: nuget-org
        strategy:
          runOnce:
            deploy:
              pool:
                vmImage: ubuntu-latest
              steps:
              - task: PowerShell@2
                displayName: 'Check whether NuGet package version already published (idempotent)'
                inputs:
                  targetType: filePath
                  filePath: '$(Pipeline.Workspace)/scripts/check-nuget-package-published.ps1'
                  arguments: '-PackageId "Microsoft.OpenApi" -PackageDirectory "$(Pipeline.Workspace)" -NuGetServiceIndexUrl "$(privateFeedBaseUrl)/nuget/v3/index.json"'
                  pwsh: true
                env:
                  FEED_ACCESS_TOKEN: $(System.AccessToken)
              - task: CopyFiles@2
                displayName: 'Stage OpenAPI NuGet packages for ESRP release'
                condition: and(succeeded(), ne(variables['nugetAlreadyPublished'], 'true'))
                inputs:
                  SourceFolder: '$(Pipeline.Workspace)'
                  Contents: |
                    Microsoft.OpenApi.*.nupkg
                    Microsoft.OpenApi.*.snupkg
                    !Microsoft.OpenApi.YamlReader.*
                  TargetFolder: '$(Pipeline.Workspace)/nuget-packages/$(NuGetOrganizationName)/openapi'
                  CleanTargetFolder: true
              - task: EsrpRelease@14
                displayName: 'ESRP Release - OpenAPI NuGet'
                condition: and(succeeded(), ne(variables['nugetAlreadyPublished'], 'true'))
                inputs:
                  connectedservicename: 'Federated DevX ESRP Managed Identity Connection'
                  usemanagedidentity: false
                  keyvaultname: 'akv-prod-eastus'
                  authcertname: 'ReferenceLibraryPrivateCert'
                  signcertname: 'ReferencePackagePublisherCertificate'
                  clientid: '65035b7f-7357-4f29-bf25-c5ee5c3949f8'
                  intent: 'packagedistribution'
                  contenttype: 'NuGet'
                  organizationname: '$(NuGetOrganizationName)'
                  contentsource: 'Folder'
                  folderlocation: '$(Pipeline.Workspace)/nuget-packages/$(NuGetOrganizationName)/openapi'
                  waitforreleasecompletion: true
                  owners: 'christiano@microsoft.com,ramsess@microsoft.com,gavinbarron@microsoft.com,jingjingjia@microsoft.com,peombwa@microsoft.com,treicys@microsoft.com'
                  approvers: 'christiano@microsoft.com,ramsess@microsoft.com,gavinbarron@microsoft.com,jingjingjia@microsoft.com,peombwa@microsoft.com,treicys@microsoft.com'
                  serviceendpointurl: 'https://api.esrp.microsoft.com/'
                  mainpublisher: 'ESRPRELPACMAN'
                  domaintenantid: 'cdc5aeea-15c5-4db6-b079-fcadd2505dc2'

      - deployment: deploy_yaml_reader
        condition: and(contains(variables['build.SourceBranch'], 'refs/tags/v'), succeeded())
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            artifactName: Nugets
            targetPath: '$(Pipeline.Workspace)'
        dependsOn: deploy_lib
        environment: nuget-org
        strategy:
          runOnce:
            deploy:
              pool:
                vmImage: ubuntu-latest
              steps:
              - task: PowerShell@2
                displayName: 'Check whether NuGet package version already published (idempotent)'
                inputs:
                  targetType: filePath
                  filePath: '$(Pipeline.Workspace)/scripts/check-nuget-package-published.ps1'
                  arguments: '-PackageId "Microsoft.OpenApi.YamlReader" -PackageDirectory "$(Pipeline.Workspace)" -NuGetServiceIndexUrl "$(privateFeedBaseUrl)/nuget/v3/index.json"'
                  pwsh: true
                env:
                  FEED_ACCESS_TOKEN: $(System.AccessToken)
              - task: CopyFiles@2
                displayName: 'Stage YAML reader NuGet packages for ESRP release'
                condition: and(succeeded(), ne(variables['nugetAlreadyPublished'], 'true'))
                inputs:
                  SourceFolder: '$(Pipeline.Workspace)'
                  Contents: |
                    Microsoft.OpenApi.YamlReader.*.nupkg
                    Microsoft.OpenApi.YamlReader.*.snupkg
                  TargetFolder: '$(Pipeline.Workspace)/nuget-packages/$(NuGetOrganizationName)/yaml-reader'
                  CleanTargetFolder: true
              - task: EsrpRelease@14
                displayName: 'ESRP Release - YAML reader NuGet'
                condition: and(succeeded(), ne(variables['nugetAlreadyPublished'], 'true'))
                inputs:
                  connectedservicename: 'Federated DevX ESRP Managed Identity Connection'
                  usemanagedidentity: false
                  keyvaultname: 'akv-prod-eastus'
                  authcertname: 'ReferenceLibraryPrivateCert'
                  signcertname: 'ReferencePackagePublisherCertificate'
                  clientid: '65035b7f-7357-4f29-bf25-c5ee5c3949f8'
                  intent: 'packagedistribution'
                  contenttype: 'NuGet'
                  organizationname: '$(NuGetOrganizationName)'
                  contentsource: 'Folder'
                  folderlocation: '$(Pipeline.Workspace)/nuget-packages/$(NuGetOrganizationName)/yaml-reader'
                  waitforreleasecompletion: true
                  owners: 'christiano@microsoft.com,ramsess@microsoft.com,gavinbarron@microsoft.com,jingjingjia@microsoft.com,peombwa@microsoft.com,treicys@microsoft.com'
                  approvers: 'christiano@microsoft.com,ramsess@microsoft.com,gavinbarron@microsoft.com,jingjingjia@microsoft.com,peombwa@microsoft.com,treicys@microsoft.com'
                  serviceendpointurl: 'https://api.esrp.microsoft.com/'
                  mainpublisher: 'ESRPRELPACMAN'
                  domaintenantid: 'cdc5aeea-15c5-4db6-b079-fcadd2505dc2'

      - deployment: create_github_release
        condition: and(contains(variables['build.SourceBranch'], 'refs/tags/v'), succeeded())
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            artifactName: Nugets
            targetPath: '$(Pipeline.Workspace)'
        dependsOn: []
        environment: kiota-github-releases
        strategy:
          runOnce:
            deploy:
              pool:
                vmImage: ubuntu-latest
              steps:
              - pwsh: |
                  $artifactName = Get-ChildItem -Path $(Pipeline.Workspace) -Filter Microsoft.OpenApi.*.nupkg -recurse | select -First 1
                  $artifactVersion= $artifactName.Name -replace "Microsoft.OpenApi.", "" -replace ".nupkg", ""
                  #Set Variable $artifactName and $artifactVersion
                  Write-Host "##vso[task.setvariable variable=artifactVersion; isSecret=false;]$artifactVersion"
                  echo "$artifactVersion"
                displayName: 'Fetch Artifact Name'
              - task: GitHubRelease@1
                displayName: 'GitHub release (edit)'
                condition: succeededOrFailed()
                inputs:
                  gitHubConnection: 'Github-MaggieKimani1'
                  action: edit
                  tagSource: userSpecifiedTag
                  tag: 'v$(artifactVersion)'
                  releaseNotesSource: inline
                  addChangeLog: false

# once the nuget has been released, fill this form to get the public documentation updated.
